<!doctype html>
<!-- 리스트 콜아웃 · 타임라인형 — 빛나는 세로선이 그어지고 빛 구슬이 줄마다 내려가며, 큰 속빈 번호가 그러데이션으로 차오르고 항목이 흐릿하게 미끄러져 나온다. 지난 줄은 작아지며 물러난다 -->
<html
  lang="ko"
  data-composition-variables='[
    {"id":"heading","type":"string","label":"머리말 (비우면 숨김)","default":"오늘 할 일"},
    {"id":"item1","type":"string","label":"1번","default":"재료 미리 손질하기"},
    {"id":"item2","type":"string","label":"2번","default":"센 불에서 3분 볶기"},
    {"id":"item3","type":"string","label":"3번","default":"간은 마지막에 맞추기"},
    {"id":"item4","type":"string","label":"4번 (비우면 숨김)","default":""},
    {"id":"item5","type":"string","label":"5번 (비우면 숨김)","default":""},
    {"id":"firstAt","type":"number","label":"첫 줄 등장 (초)","default":0.55,"min":0.3,"max":20,"step":0.05,"unit":"s"},
    {"id":"itemGap","type":"number","label":"줄 간격 (초)","default":1.1,"min":0.2,"max":5,"step":0.05,"unit":"s"},
    {"id":"accent","type":"color","label":"강조색 1","default":"#2BE4FF"},
    {"id":"accent2","type":"color","label":"강조색 2","default":"#FF2D87"},
    {"id":"accent3","type":"color","label":"강조색 3","default":"#FFE21F"},
    {"id":"base","type":"color","label":"글자 색","default":"#FFFFFF"},
    {"id":"ink","type":"color","label":"외곽선 색","default":"#0A0612"},
    {"id":"exitAt","type":"number","label":"퇴장 시작 (초, 전체 길이-0.7 이하)","default":5.2,"min":1.5,"max":60,"step":0.05,"unit":"s"},
    {"id":"backdrop","type":"enum","label":"배경","default":"none","options":[{"value":"none","label":"투명"},{"value":"green","label":"초록 화면"},{"value":"preview","label":"미리보기용 회색"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Glow Timeline List</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
/* 무료 모션그래픽 팩 v2 공통 스타일 — 글꼴·배경·외곽선·광채 같은 10종 공통 부품 (make_templates.sh가 각 index.html에 넣는다) */
@font-face { font-family: "Pretendard"; src: url("assets/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; }
@font-face { font-family: "Black Han Sans"; src: url("assets/fonts/BlackHanSans-Regular.ttf") format("truetype"); }
@font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  font-family: "Pretendard", sans-serif; -webkit-font-smoothing: antialiased;
  /* 큰 제목 글꼴: 한글은 Black Han Sans, 영어만 있으면 Anton(대문자) */
  --disp: "Black Han Sans", "Pretendard", sans-serif;
  --disp-case: none; --disp-track: -0.01em;
}
#root.latin { --disp: "Anton", "Black Han Sans", sans-serif; --disp-case: uppercase; --disp-track: 0.01em; }
#backdrop { position: absolute; inset: 0; }
#backdrop.green { background: #00ff00; }
#backdrop.preview { background: radial-gradient(120% 90% at 30% 20%, #8b8f99 0%, #5d626c 45%, #3a3d44 100%); }
#stage, #cam { position: absolute; inset: 0; }
.disp { font-family: var(--disp); text-transform: var(--disp-case); letter-spacing: var(--disp-track); }
/* 굵은 검은 외곽선 + 부드러운 그림자: 밝은 화면·어두운 화면 어디서나 읽히게 */
.outline { -webkit-text-stroke: var(--sw, 12px) var(--ink, #0A0612); paint-order: stroke fill; }
.lift { filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 14px 26px rgba(0,0,0,.45)); }
/* 반짝이·불꽃 조각 */
.fx { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.spark { position: absolute; left: 0; top: 0; border-radius: 99px; }
.star { position: absolute; left: 0; top: 0; }
.star::before, .star::after { content: ""; position: absolute; left: 50%; top: 50%; background: currentColor; border-radius: 99px; transform: translate(-50%, -50%); box-shadow: 0 0 12px currentColor; }
.star::before { width: 100%; height: 18%; }
.star::after { width: 18%; height: 100%; }
.ring { position: absolute; left: 0; top: 0; border-radius: 50%; border-style: solid; }
/* 무지개빛 글자: 아래는 검은 외곽선 글자, 위에 같은 글자를 그러데이션으로 한 겹 더 얹는다(--gp로 빛이 흐른다) */
.gt { position: relative; }
.gt::after {
  content: attr(data-t); position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: inherit; white-space: nowrap;
  -webkit-text-stroke: 0; color: transparent;
  background-image: var(--grad); background-size: 300% 100%; background-position: var(--gp, 0%) 50%;
  -webkit-background-clip: text; background-clip: text;
}
/* 초록 화면 모드(backdrop=green): 반투명 빛 번짐·흐린 그림자·빛 테두리 후광·충격파 고리를 끈다
   → 가장자리가 딱 떨어져 크로마 키로 깨끗하게 빠진다. 투명 MOV·WebM(backdrop=none)은 그대로 다 빛난다 */
#root:has(#backdrop.green) *, #root:has(#backdrop.green) *::before, #root:has(#backdrop.green) *::after {
  box-shadow: none !important; text-shadow: none !important;
}
#root:has(#backdrop.green) *:not(.pan) { filter: none !important; }
#root:has(#backdrop.green) .ring, #root:has(#backdrop.green) #halo, #root:has(#backdrop.green) .sonar { display: none !important; }

      #tlx { position: absolute; left: 60px; width: 830px; top: 430px; height: 1040px; display: flex; flex-direction: column; justify-content: center; gap: 30px; --fs: 78px; }
      #root.wide #tlx { left: 120px; width: 1150px; top: 100px; height: 880px; gap: 22px; --fs: 64px; }
      #head { align-self: flex-start; font-size: calc(var(--fs) * 0.8); color: var(--accent3); background: var(--ink); padding: 0.16em 0.7em 0.22em; border-radius: 99px; white-space: nowrap; margin-left: 0.2em;
        box-shadow: 0 0 0 0.07em var(--accent3), 0 0.12em 0 0.07em rgba(0,0,0,.35), 0 0 0.6em color-mix(in srgb, var(--accent3) 50%, transparent); }
      #rows { position: relative; display: flex; flex-direction: column; gap: 0.4em; font-size: var(--fs); padding-left: 0.2em; }
      #line { position: absolute; left: calc(0.2em + 0.62em - 0.06em); width: 0.12em; top: 0.5em; bottom: 0.5em; border-radius: 99px;
        background: linear-gradient(180deg, var(--accent), var(--accent2), var(--accent3)); box-shadow: 0 0 0 0.04em var(--ink), 0 0 20px var(--accent); }
      #orb { position: absolute; left: calc(0.2em + 0.62em); top: 0; width: 0.5em; height: 0.5em; margin: -0.25em 0 0 -0.25em; border-radius: 50%; background: #fff; box-shadow: 0 0 18px #fff, 0 0 40px var(--accent); }
      .row { position: relative; display: flex; align-items: center; gap: 0.45em; }
      .num { position: relative; flex: none; width: 1.24em; height: 1.24em; border-radius: 50%; background: var(--ink); display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 0 0.05em rgba(255,255,255,.85); }
      .nO, .nF { position: absolute; font-family: "Anton", sans-serif; font-size: 0.78em; line-height: 1; }
      .nO { color: var(--ink); -webkit-text-stroke: 0.035em #fff; }
      .nF { color: transparent; background: linear-gradient(0deg, var(--accent2), var(--accent3)); -webkit-background-clip: text; background-clip: text; }
      .ring2 { position: absolute; inset: -0.08em; border-radius: 50%; border: 0.06em solid var(--accent); box-shadow: 0 0 18px var(--accent); opacity: 0; }
      .txt { font-weight: 880; letter-spacing: -0.03em; color: var(--base); --sw: 0.13em; white-space: nowrap; line-height: 1.15; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="backdrop"></div>
      <div id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="cam">
          <div id="tlx" class="lift">
            <div id="head" class="disp"></div>
            <div id="rows"><div id="line"></div><div id="orb"></div></div>
          </div>
          <div id="fx" class="fx"></div>
        </div>
      </div>
    </div>
    <script>
// 무료 모션그래픽 팩 v2 공통 함수 — 정해진 난수·글자 쪼개기·불꽃 터짐·화면 흔들림·색 번짐 (make_templates.sh가 각 index.html에 넣는다)
var FX = (function () {
  // 같은 씨앗이면 늘 같은 값: 렌더할 때마다 반짝이 위치가 똑같이 나온다
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hasHangul(v) { return /[ㄱ-힝]/.test(JSON.stringify(v)); }
  // 글을 한 글자씩 span으로 나눈다(띄어쓰기는 그대로 둔다)
  function chars(el, text, cls) {
    el.textContent = "";
    var out = [];
    Array.from(String(text)).forEach(function (c) {
      if (c === " ") { el.appendChild(document.createTextNode(" ")); return; }
      var s = document.createElement("span");
      s.className = cls || "ch"; s.textContent = c; s.style.display = "inline-block";
      el.appendChild(s); out.push(s);
    });
    return out;
  }
  // 한 점(x, y)에서 불꽃 조각과 별이 사방으로 터진다
  function burst(tl, parent, x, y, t, o) {
    o = o || {};
    var r = rng(o.seed || 7), n = o.n || 12, colors = o.colors || ["#FFE14A", "#FF2D87", "#2BE4FF", "#FFFFFF"];
    var dist = o.dist || 150, size = o.size || 1;
    var box = document.createElement("div"); box.className = "fx"; box.style.left = x + "px"; box.style.top = y + "px";
    parent.appendChild(box);
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + r() * 0.5, d = dist * (0.6 + r() * 0.6), col = colors[i % colors.length];
      var star = r() < (o.stars == null ? 0.35 : o.stars);
      var p = document.createElement("div");
      if (star) {
        var s = (18 + r() * 22) * size;
        p.className = "star"; p.style.color = col; p.style.width = s + "px"; p.style.height = s + "px";
        p.style.marginLeft = -s / 2 + "px"; p.style.marginTop = -s / 2 + "px";
      } else {
        var len = (26 + r() * 30) * size, th = (6 + r() * 4) * size;
        p.className = "spark"; p.style.background = col; p.style.width = len + "px"; p.style.height = th + "px";
        p.style.marginLeft = -len / 2 + "px"; p.style.marginTop = -th / 2 + "px";
        p.style.boxShadow = "0 0 14px " + col;
      }
      box.appendChild(p);
      var dx = Math.cos(a) * d, dy = Math.sin(a) * d, rot = a * 180 / Math.PI;
      gsap.set(p, { opacity: 0 });
      tl.set(p, { x: 0, y: 0, rotation: star ? 0 : rot, scale: 0.2, opacity: 1 }, t);
      tl.to(p, { x: dx, y: dy, rotation: star ? 180 : rot, scale: star ? 1 : 0.9, duration: 0.55 + r() * 0.2, ease: "expo.out" }, t);
      tl.to(p, { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, t + 0.35 + r() * 0.2);
    }
    return box;
  }
  // 충격파 고리: 한 점에서 크게 퍼지며 사라진다
  function shock(tl, parent, x, y, t, o) {
    o = o || {};
    var size = o.size || 300, el = document.createElement("div");
    el.className = "ring"; el.style.width = size + "px"; el.style.height = size + "px";
    el.style.left = x - size / 2 + "px"; el.style.top = y - size / 2 + "px";
    el.style.borderWidth = (o.width || 10) + "px"; el.style.borderColor = o.color || "#FFFFFF";
    el.style.boxShadow = "0 0 30px " + (o.color || "#FFFFFF");
    parent.appendChild(el);
    gsap.set(el, { opacity: 0 });
    tl.set(el, { scale: 0.1, opacity: 1 }, t);
    tl.to(el, { scale: 1, opacity: 0, duration: o.dur || 0.6, ease: "expo.out" }, t);
    return el;
  }
  // 화면 흔들림: 짧게 이리저리 튀다 제자리
  function shake(tl, target, t, amp, dur, seed) {
    var r = rng(seed || 3), steps = 7, d = (dur || 0.35) / (steps + 1), kf = [];
    for (var i = 0; i < steps; i++) {
      var k = amp * (1 - i / steps);
      kf.push({ x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k, rotation: (r() * 2 - 1) * k * 0.04, duration: d, ease: "none" });
    }
    kf.push({ x: 0, y: 0, rotation: 0, duration: d, ease: "power2.out" });
    tl.to(target, { keyframes: kf }, t);
  }
  // 색 번짐(글리치): 잠깐 청록·분홍으로 갈라졌다 돌아온다
  function rgb(tl, target, t, px, base) {
    base = base || "";
    function s(k) { return (base ? base + ", " : "") + (-px * k) + "px 0 0 #2BE4FF, " + (px * k) + "px 0 0 #FF2D87"; }
    tl.set(target, { textShadow: s(1) }, t);
    tl.set(target, { textShadow: s(-0.6) }, t + 0.05);
    tl.set(target, { textShadow: s(0.4) }, t + 0.1);
    tl.set(target, { textShadow: base || "none" }, t + 0.16);
  }
  // 칸 너비에 맞을 때까지 글자 크기를 줄인다
  function fit(el, maxW, minPx, prop) {
    prop = prop || "fontSize";
    var fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > maxW && fs > (minPx || 24)) { fs -= 2; el.style.fontSize = fs + "px"; }
    return fs;
  }
  return { rng: rng, hasHangul: hasHangul, chars: chars, burst: burst, shock: shock, shake: shake, rgb: rgb, fit: fit };
})();

      (function () {
        var v = window.__hyperframes.getVariables();
        var root = document.getElementById("root");
        var W = Number(root.getAttribute("data-width")), H = Number(root.getAttribute("data-height"));
        var wide = W > H;
        if (wide) root.classList.add("wide");
        if (!FX.hasHangul([v.heading, v.item1, v.item2])) root.classList.add("latin");
        if (v.backdrop !== "none") document.getElementById("backdrop").className = v.backdrop;
        ["accent", "accent2", "accent3", "base", "ink"].forEach(function (k) { root.style.setProperty("--" + k, v[k]); });
        var head = document.getElementById("head"); head.textContent = v.heading;
        if (!String(v.heading || "").trim()) head.style.display = "none";
        var rowsEl = document.getElementById("rows"), rows = [];
        [v.item1, v.item2, v.item3, v.item4, v.item5].filter(function (t) { return String(t || "").trim(); }).forEach(function (t, i) {
          var r = document.createElement("div"); r.className = "row";
          var n = String(i + 1).padStart(2, "0");
          r.innerHTML = '<div class="num"><div class="ring2"></div><span class="nO" data-layout-allow-occlusion>' + n + '</span><span class="nF" data-layout-allow-occlusion>' + n + '</span></div><div class="txt outline"></div>';
          r.querySelector(".txt").textContent = t;
          rowsEl.appendChild(r); rows.push(r);
        });

        document.fonts.ready.then(function () {
          var box = document.getElementById("tlx");
          var fs = parseFloat(getComputedStyle(box).getPropertyValue("--fs"));
          function over() { return rows.some(function (r) { var t = r.lastChild; return t.offsetLeft + t.offsetWidth > box.clientWidth - 20; }) || box.scrollHeight > box.clientHeight; }
          while (over() && fs > 24) { fs -= 2; box.style.setProperty("--fs", fs + "px"); }

          var tl = gsap.timeline({ paused: true }), E = v.exitAt, fx = document.getElementById("fx");
          var n = rows.length, gap = n > 1 ? Math.min(v.itemGap, (E - 0.7 - v.firstAt) / (n - 1)) : 0;
          var centers = rows.map(function (r) { return r.offsetTop + r.offsetHeight / 2; });
          var rects = rows.map(function (r) { return r.querySelector(".num").getBoundingClientRect(); });

          // 머리말 알약이 튀어나오고 → 세로선이 위에서 아래로 그어진다
          tl.fromTo(head, { scale: 0, rotation: -10, transformOrigin: "0% 50%" }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, 0.05);
          tl.fromTo("#line", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.7, ease: "expo.out" }, 0.2);
          gsap.set(rows, { opacity: 0 });
          tl.set("#orb", { y: centers[0] || 0, scale: 0 }, 0);
          tl.to("#orb", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.3);

          rows.forEach(function (r, i) {
            var T = v.firstAt + i * gap, num = r.querySelector(".num"), txt = r.querySelector(".txt");
            // 빛 구슬이 그 줄로 미끄러져 내려간다
            if (i > 0) tl.to("#orb", { y: centers[i], duration: 0.4, ease: "power3.inOut" }, T - 0.3);
            // 번호 동그라미가 튀고 → 속빈 번호가 아래부터 그러데이션으로 차고 → 고리가 퍼진다
            tl.set(r, { opacity: 1 }, T);
            tl.fromTo(num, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, T);
            tl.fromTo(r.querySelector(".nF"), { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.4, ease: "power2.out" }, T + 0.2);
            tl.fromTo(r.querySelector(".ring2"), { scale: 1, opacity: 1 }, { scale: 1.9, opacity: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, T + 0.2);
            // 글이 왼쪽에서 흐릿하게 늘어난 채 미끄러져 선다
            tl.fromTo(txt, { x: -90, opacity: 0, scaleX: 1.3, filter: "blur(14px)", transformOrigin: "0% 50%" }, { x: 0, opacity: 1, scaleX: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, T + 0.08);
            FX.burst(tl, fx, rects[i].left + rects[i].width / 2, rects[i].top + rects[i].height / 2, T + 0.22, { n: 8, dist: 120, seed: 70 + i, colors: [v.accent, v.accent2, v.accent3, "#FFFFFF"], size: 0.9 });
            // 앞 줄은 작아지며 흐려진다
            if (i > 0) {
              // 초록 화면 모드에서는 반투명 대신 회색 글자로 물러난다(반투명이면 초록이 비쳐 키가 지저분해진다)
              var dim = v.backdrop === "green" ? { color: "#A9A5B8" } : { opacity: 0.6 };
              tl.to(rows[i - 1].querySelector(".txt"), Object.assign({ scale: 0.9, transformOrigin: "0% 50%", duration: 0.35, ease: "power2.out" }, dim), T);
              tl.fromTo(rows[i - 1].querySelector(".num"), { filter: "grayscale(0) brightness(1)" }, { scale: 0.82, filter: "grayscale(1) brightness(0.8)", duration: 0.35, ease: "power2.out", immediateRender: false }, T);
            }
          });

          // 퇴장: 줄들이 위로 흐리며 날아가고 → 선이 감기고 → 머리말이 작아진다
          tl.to("#orb", { scale: 0, duration: 0.2, ease: "back.in(2)" }, E);
          tl.to(rows, { y: -60, opacity: 0, filter: "blur(12px)", duration: 0.35, ease: "power2.in", stagger: 0.05 }, E);
          tl.set("#line", { transformOrigin: "50% 100%" }, E + 0.1);
          tl.to("#line", { scaleY: 0, duration: 0.35, ease: "expo.in" }, E + 0.1);
          tl.to(head, { scale: 0, rotation: 10, duration: 0.3, ease: "back.in(2)" }, E + 0.25);

          window.__timelines["main"] = tl;
        });
      })();
    </script>
  </body>
</html>
