<!doctype html>
<!-- 네온 테두리 정보 카드 — 어두운 카드가 3D로 휙 돌아 들어오고, 무지개빛 테두리와 빛 번짐이 카드 둘레를 계속 돌며, 꼬리표·제목·밑줄·본문이 차례로 떠오른다. 끝에는 뒤로 넘어가며 사라진다 -->
<html
  lang="ko"
  data-composition-variables='[
    {"id":"tag","type":"string","label":"꼬리표 (비우면 숨김)","default":"알아두기"},
    {"id":"title","type":"string","label":"제목 (두 줄까지)","default":"배터리 오래 쓰는 법"},
    {"id":"body1","type":"string","label":"본문 첫 줄","default":"화면 밝기는 자동으로 두고"},
    {"id":"body2","type":"string","label":"본문 둘째 줄 (비우면 숨김)","default":"안 쓰는 앱은 꼭 닫아 주세요."},
    {"id":"accent","type":"color","label":"테두리 색 1","default":"#FF2D87"},
    {"id":"accent2","type":"color","label":"테두리 색 2","default":"#FFE21F"},
    {"id":"accent3","type":"color","label":"테두리 색 3","default":"#2BE4FF"},
    {"id":"card","type":"color","label":"카드 색","default":"#120C26"},
    {"id":"bodyInk","type":"color","label":"본문 글자 색","default":"#E4DEF5"},
    {"id":"exitAt","type":"number","label":"퇴장 시작 (초, 전체 길이-0.7 이하)","default":4.3,"min":1.5,"max":60,"step":0.05,"unit":"s"},
    {"id":"backdrop","type":"enum","label":"배경","default":"none","options":[{"value":"none","label":"투명"},{"value":"green","label":"초록 화면"},{"value":"preview","label":"미리보기용 회색"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Neon Glow Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
/* 무료 모션그래픽 팩 v2 공통 스타일 — 글꼴·배경·외곽선·광채 같은 10종 공통 부품 (make_templates.sh가 각 index.html에 넣는다) */
@font-face { font-family: "Pretendard"; src: url("assets/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; }
@font-face { font-family: "Black Han Sans"; src: url("assets/fonts/BlackHanSans-Regular.ttf") format("truetype"); }
@font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
#root {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  font-family: "Pretendard", sans-serif; -webkit-font-smoothing: antialiased;
  /* 큰 제목 글꼴: 한글은 Black Han Sans, 영어만 있으면 Anton(대문자) */
  --disp: "Black Han Sans", "Pretendard", sans-serif;
  --disp-case: none; --disp-track: -0.01em;
}
#root.latin { --disp: "Anton", "Black Han Sans", sans-serif; --disp-case: uppercase; --disp-track: 0.01em; }
#backdrop { position: absolute; inset: 0; }
#backdrop.green { background: #00ff00; }
#backdrop.preview { background: radial-gradient(120% 90% at 30% 20%, #8b8f99 0%, #5d626c 45%, #3a3d44 100%); }
#stage, #cam { position: absolute; inset: 0; }
.disp { font-family: var(--disp); text-transform: var(--disp-case); letter-spacing: var(--disp-track); }
/* 굵은 검은 외곽선 + 부드러운 그림자: 밝은 화면·어두운 화면 어디서나 읽히게 */
.outline { -webkit-text-stroke: var(--sw, 12px) var(--ink, #0A0612); paint-order: stroke fill; }
.lift { filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 14px 26px rgba(0,0,0,.45)); }
/* 반짝이·불꽃 조각 */
.fx { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.spark { position: absolute; left: 0; top: 0; border-radius: 99px; }
.star { position: absolute; left: 0; top: 0; }
.star::before, .star::after { content: ""; position: absolute; left: 50%; top: 50%; background: currentColor; border-radius: 99px; transform: translate(-50%, -50%); box-shadow: 0 0 12px currentColor; }
.star::before { width: 100%; height: 18%; }
.star::after { width: 18%; height: 100%; }
.ring { position: absolute; left: 0; top: 0; border-radius: 50%; border-style: solid; }
/* 무지개빛 글자: 아래는 검은 외곽선 글자, 위에 같은 글자를 그러데이션으로 한 겹 더 얹는다(--gp로 빛이 흐른다) */
.gt { position: relative; }
.gt::after {
  content: attr(data-t); position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: inherit; white-space: nowrap;
  -webkit-text-stroke: 0; color: transparent;
  background-image: var(--grad); background-size: 300% 100%; background-position: var(--gp, 0%) 50%;
  -webkit-background-clip: text; background-clip: text;
}
/* 초록 화면 모드(backdrop=green): 반투명 빛 번짐·흐린 그림자·빛 테두리 후광·충격파 고리를 끈다
   → 가장자리가 딱 떨어져 크로마 키로 깨끗하게 빠진다. 투명 MOV·WebM(backdrop=none)은 그대로 다 빛난다 */
#root:has(#backdrop.green) *, #root:has(#backdrop.green) *::before, #root:has(#backdrop.green) *::after {
  box-shadow: none !important; text-shadow: none !important;
}
#root:has(#backdrop.green) *:not(.pan) { filter: none !important; }
#root:has(#backdrop.green) .ring, #root:has(#backdrop.green) #halo, #root:has(#backdrop.green) .sonar { display: none !important; }

      #pos { position: absolute; left: 80px; width: 800px; top: 560px; --fs: 100px; }
      #root.wide #pos { left: 460px; width: 1000px; top: 210px; --fs: 96px; }
      #wrap { position: relative; }
      .conic { background: conic-gradient(from var(--ang, 0deg), var(--accent), var(--accent2), var(--accent3), var(--accent)); }
      #halo { position: absolute; inset: -6px; border-radius: 48px; filter: blur(30px); opacity: 0.75; }
      #frame { position: relative; border-radius: 44px; padding: 7px; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
      #card { position: relative; border-radius: 38px; background: radial-gradient(130% 90% at 15% 0%, color-mix(in srgb, var(--card) 70%, #3B1F6E) 0%, var(--card) 60%); padding: 60px 64px 64px; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; overflow: hidden; }
      #tagp { font-size: calc(var(--fs) * 0.36); font-weight: 900; color: #0A0612; padding: 0.2em 0.75em 0.26em; border-radius: 99px; background: linear-gradient(90deg, var(--accent2), var(--accent)); letter-spacing: 0.02em; white-space: nowrap; box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 60%, transparent); }
      #ttl { font-size: var(--fs); color: #fff; line-height: 1.12; word-break: keep-all; text-wrap: balance; }
      #ttl .ch { display: inline-block; }
      #ul { width: 42%; height: 12px; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); box-shadow: 0 0 22px var(--accent); }
      .bd { font-size: calc(var(--fs) * 0.44); font-weight: 650; color: var(--bodyInk); line-height: 1.4; letter-spacing: -0.02em; word-break: keep-all; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="backdrop"></div>
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div id="cam">
          <div id="pos">
            <div id="wrap">
              <div id="halo" class="conic"></div>
              <div id="frame" class="conic">
                <div id="card">
                  <div id="tagp"></div>
                  <div id="ttl" class="disp"></div>
                  <div id="ul"></div>
                  <div class="bd" id="b1"></div>
                  <div class="bd" id="b2"></div>
                </div>
              </div>
            </div>
          </div>
          <div id="fx" class="fx"></div>
        </div>
      </div>
    </div>
    <script>
// 무료 모션그래픽 팩 v2 공통 함수 — 정해진 난수·글자 쪼개기·불꽃 터짐·화면 흔들림·색 번짐 (make_templates.sh가 각 index.html에 넣는다)
var FX = (function () {
  // 같은 씨앗이면 늘 같은 값: 렌더할 때마다 반짝이 위치가 똑같이 나온다
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hasHangul(v) { return /[ㄱ-힝]/.test(JSON.stringify(v)); }
  // 글을 한 글자씩 span으로 나눈다(띄어쓰기는 그대로 둔다)
  function chars(el, text, cls) {
    el.textContent = "";
    var out = [];
    Array.from(String(text)).forEach(function (c) {
      if (c === " ") { el.appendChild(document.createTextNode(" ")); return; }
      var s = document.createElement("span");
      s.className = cls || "ch"; s.textContent = c; s.style.display = "inline-block";
      el.appendChild(s); out.push(s);
    });
    return out;
  }
  // 한 점(x, y)에서 불꽃 조각과 별이 사방으로 터진다
  function burst(tl, parent, x, y, t, o) {
    o = o || {};
    var r = rng(o.seed || 7), n = o.n || 12, colors = o.colors || ["#FFE14A", "#FF2D87", "#2BE4FF", "#FFFFFF"];
    var dist = o.dist || 150, size = o.size || 1;
    var box = document.createElement("div"); box.className = "fx"; box.style.left = x + "px"; box.style.top = y + "px";
    parent.appendChild(box);
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + r() * 0.5, d = dist * (0.6 + r() * 0.6), col = colors[i % colors.length];
      var star = r() < (o.stars == null ? 0.35 : o.stars);
      var p = document.createElement("div");
      if (star) {
        var s = (18 + r() * 22) * size;
        p.className = "star"; p.style.color = col; p.style.width = s + "px"; p.style.height = s + "px";
        p.style.marginLeft = -s / 2 + "px"; p.style.marginTop = -s / 2 + "px";
      } else {
        var len = (26 + r() * 30) * size, th = (6 + r() * 4) * size;
        p.className = "spark"; p.style.background = col; p.style.width = len + "px"; p.style.height = th + "px";
        p.style.marginLeft = -len / 2 + "px"; p.style.marginTop = -th / 2 + "px";
        p.style.boxShadow = "0 0 14px " + col;
      }
      box.appendChild(p);
      var dx = Math.cos(a) * d, dy = Math.sin(a) * d, rot = a * 180 / Math.PI;
      gsap.set(p, { opacity: 0 });
      tl.set(p, { x: 0, y: 0, rotation: star ? 0 : rot, scale: 0.2, opacity: 1 }, t);
      tl.to(p, { x: dx, y: dy, rotation: star ? 180 : rot, scale: star ? 1 : 0.9, duration: 0.55 + r() * 0.2, ease: "expo.out" }, t);
      tl.to(p, { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, t + 0.35 + r() * 0.2);
    }
    return box;
  }
  // 충격파 고리: 한 점에서 크게 퍼지며 사라진다
  function shock(tl, parent, x, y, t, o) {
    o = o || {};
    var size = o.size || 300, el = document.createElement("div");
    el.className = "ring"; el.style.width = size + "px"; el.style.height = size + "px";
    el.style.left = x - size / 2 + "px"; el.style.top = y - size / 2 + "px";
    el.style.borderWidth = (o.width || 10) + "px"; el.style.borderColor = o.color || "#FFFFFF";
    el.style.boxShadow = "0 0 30px " + (o.color || "#FFFFFF");
    parent.appendChild(el);
    gsap.set(el, { opacity: 0 });
    tl.set(el, { scale: 0.1, opacity: 1 }, t);
    tl.to(el, { scale: 1, opacity: 0, duration: o.dur || 0.6, ease: "expo.out" }, t);
    return el;
  }
  // 화면 흔들림: 짧게 이리저리 튀다 제자리
  function shake(tl, target, t, amp, dur, seed) {
    var r = rng(seed || 3), steps = 7, d = (dur || 0.35) / (steps + 1), kf = [];
    for (var i = 0; i < steps; i++) {
      var k = amp * (1 - i / steps);
      kf.push({ x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k, rotation: (r() * 2 - 1) * k * 0.04, duration: d, ease: "none" });
    }
    kf.push({ x: 0, y: 0, rotation: 0, duration: d, ease: "power2.out" });
    tl.to(target, { keyframes: kf }, t);
  }
  // 색 번짐(글리치): 잠깐 청록·분홍으로 갈라졌다 돌아온다
  function rgb(tl, target, t, px, base) {
    base = base || "";
    function s(k) { return (base ? base + ", " : "") + (-px * k) + "px 0 0 #2BE4FF, " + (px * k) + "px 0 0 #FF2D87"; }
    tl.set(target, { textShadow: s(1) }, t);
    tl.set(target, { textShadow: s(-0.6) }, t + 0.05);
    tl.set(target, { textShadow: s(0.4) }, t + 0.1);
    tl.set(target, { textShadow: base || "none" }, t + 0.16);
  }
  // 칸 너비에 맞을 때까지 글자 크기를 줄인다
  function fit(el, maxW, minPx, prop) {
    prop = prop || "fontSize";
    var fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > maxW && fs > (minPx || 24)) { fs -= 2; el.style.fontSize = fs + "px"; }
    return fs;
  }
  return { rng: rng, hasHangul: hasHangul, chars: chars, burst: burst, shock: shock, shake: shake, rgb: rgb, fit: fit };
})();

      (function () {
        var v = window.__hyperframes.getVariables();
        var root = document.getElementById("root");
        var W = Number(root.getAttribute("data-width")), H = Number(root.getAttribute("data-height"));
        var wide = W > H;
        if (wide) root.classList.add("wide");
        if (!FX.hasHangul([v.tag, v.title, v.body1])) root.classList.add("latin");
        if (v.backdrop !== "none") document.getElementById("backdrop").className = v.backdrop;
        ["accent", "accent2", "accent3", "card", "bodyInk"].forEach(function (k) { root.style.setProperty("--" + k, v[k]); });
        function txt(id, t) { var e = document.getElementById(id); e.textContent = t; if (!String(t || "").trim()) e.style.display = "none"; return e; }
        txt("tagp", v.tag); txt("b1", v.body1); txt("b2", v.body2);
        // 제목은 낱말 단위로 줄을 바꾸고(한 글자만 다음 줄로 떨어지지 않게) 글자마다 움직인다
        var ttlEl = document.getElementById("ttl"), tch = [];
        String(v.title || "").trim().split(/\s+/).filter(Boolean).forEach(function (w, i) {
          if (i) ttlEl.appendChild(document.createTextNode(" "));
          var g = document.createElement("span"); g.style.display = "inline-block"; g.style.whiteSpace = "nowrap";
          ttlEl.appendChild(g); tch = tch.concat(FX.chars(g, w));
        });

        document.fonts.ready.then(function () {
          var pos = document.getElementById("pos"), ttl = document.getElementById("ttl"), card = document.getElementById("card");
          // 제목이 두 줄을 넘으면 글자를 줄인다
          var fs = parseFloat(getComputedStyle(pos).getPropertyValue("--fs"));
          function lines() { var t = {}; tch.forEach(function (c) { t[c.offsetTop] = 1; }); return Object.keys(t).length; }
          while ((lines() > 2 || card.scrollWidth > card.clientWidth) && fs > 30) { fs -= 2; pos.style.setProperty("--fs", fs + "px"); }
          // 세로판: 카드가 쇼츠 아래 UI(아래 440px) 위로 오게 한다
          var bottom = H - (wide ? 70 : 440);
          if (pos.offsetTop + pos.offsetHeight > bottom) pos.style.top = Math.max(wide ? 70 : 160, bottom - pos.offsetHeight) + "px";
          if (wide) pos.style.top = (H - pos.offsetHeight) / 2 + "px";

          var tl = gsap.timeline({ paused: true }), E = v.exitAt, fx = document.getElementById("fx");
          var pr = pos.getBoundingClientRect();
          // 테두리 빛이 카드 둘레를 계속 돈다
          tl.fromTo(".conic", { "--ang": "0deg" }, { "--ang": "540deg", duration: E + 0.7, ease: "none" }, 0);
          // 1) 카드가 3D로 휙 돌아 들어오며 흐림이 걷힌다 → 빛 번짐이 한 번 크게 번쩍
          tl.fromTo("#wrap", { rotationY: -85, rotationX: 12, scale: 0.7, opacity: 0, filter: "blur(18px)", transformPerspective: 1600, transformOrigin: "0% 50%" },
            { rotationY: 0, rotationX: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "back.out(1.4)" }, 0.05);
          tl.fromTo("#halo", { opacity: 0, scale: 0.9 }, { keyframes: [{ opacity: 1, scale: 1.08, duration: 0.25 }, { opacity: 0.75, scale: 1, duration: 0.5, ease: "power2.out" }] }, 0.4);
          FX.burst(tl, fx, pr.right - 30, pr.top + 30, 0.55, { n: 12, dist: 200, seed: 23, stars: 0.6, colors: [v.accent, v.accent2, v.accent3, "#FFFFFF"], size: 1.1 });
          // 2) 꼬리표 → 제목(한 글자씩 흐릿하게 솟음) → 밑줄 → 본문
          tl.fromTo("#tagp", { scale: 0, rotation: -12, transformOrigin: "0% 50%" }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.8)" }, 0.4);
          tl.fromTo(tch, { y: 60, opacity: 0, rotationX: -70, filter: "blur(12px)", transformPerspective: 800 },
            { y: 0, opacity: 1, rotationX: 0, filter: "blur(0px)", duration: 0.5, ease: "back.out(2)", stagger: 0.035 }, 0.5);
          var tEnd = 0.5 + tch.length * 0.035;
          tl.fromTo("#ul", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.55, ease: "expo.out" }, tEnd);
          tl.fromTo(".bd", { y: 26, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.12 }, tEnd + 0.12);
          // 머무는 동안 살짝 떠 있는 느낌
          tl.to("#pos", { y: -10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.4);

          // 퇴장: 글이 먼저 흐려지고 → 카드가 뒤로 넘어가며 작아진다
          tl.to([".bd", "#ul", "#tagp"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, E);
          tl.to(tch, { y: -30, opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.in", stagger: 0.01 }, E);
          tl.set("#wrap", { transformOrigin: "50% 100%" }, E + 0.15);
          tl.to("#wrap", { rotationX: 75, scale: 0.75, opacity: 0, filter: "blur(16px)", duration: 0.42, ease: "power3.in" }, E + 0.15);

          window.__timelines["main"] = tl;
        });
      })();
    </script>
  </body>
</html>
